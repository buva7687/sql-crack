name: Release

# Fires automatically on every push to main. If package.json contains a version
# that has not been released yet (no matching git tag), it builds, creates the
# GitHub release/tag, then publishes the packaged VSIX to external registries.
# A manual run can rebuild the exact tagged source and retry any one failed
# publication target without repeating targets that already succeeded.
#
# Marketplace / Open VSX publishing stays OFF unless the VSCE_PAT / OVSX_PAT
# repository secrets are configured. No secret values are ever written to logs.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to resume (for example 0.9.2); leave blank for the package version"
        required: false
        type: string
      release_target:
        description: "Full release, or one publication target to retry for an existing tag"
        required: true
        default: full-release
        type: choice
        options:
          - full-release
          - github-release
          - vscode-marketplace
          - open-vsx

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      release_channel: ${{ steps.check.outputs.release_channel }}
      release_mode: ${{ steps.check.outputs.release_mode }}
      checkout_ref: ${{ steps.check.outputs.checkout_ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine whether a release is needed
        id: check
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED_RELEASE_MODE: ${{ github.event.inputs.release_target || 'full-release' }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VERSION="${REQUESTED_VERSION:-$PACKAGE_VERSION}"
          RELEASE_MODE="$REQUESTED_RELEASE_MODE"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"

          if [[ "$RELEASE_MODE" == "full-release" && "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "A full release must use package.json version $PACKAGE_VERSION, not $VERSION." >&2
            exit 1
          fi

          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            if git cat-file -e "refs/tags/v$VERSION:release.config.json" 2>/dev/null; then
              RELEASE_CHANNEL="$(git show "refs/tags/v$VERSION:release.config.json" | node -e "let source=''; process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => console.log(JSON.parse(source).channel));")"
            else
              # Releases created before channel metadata was introduced are stable.
              RELEASE_CHANNEL="stable"
            fi
            if [[ "$RELEASE_MODE" == "full-release" ]]; then
              echo "Tag v$VERSION already exists; nothing to release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=refs/tags/v$VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "Retrying $RELEASE_MODE from existing tag v$VERSION."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=refs/tags/v$VERSION" >> "$GITHUB_OUTPUT"
            fi
          else
            RELEASE_CHANNEL="$(node -p "require('./release.config.json').channel")"
            if [[ "$RELEASE_MODE" != "full-release" ]]; then
              echo "Cannot retry $RELEASE_MODE because tag v$VERSION does not exist." >&2
              exit 1
            fi
            echo "No tag for v$VERSION yet; a release will be created."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$RELEASE_CHANNEL" != "stable" && "$RELEASE_CHANNEL" != "pre-release" ]]; then
            echo "Invalid release channel: $RELEASE_CHANNEL" >&2
            exit 1
          fi
          echo "release_channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG_NAME: v${{ needs.check.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.check.outputs.release_channel }}
      RELEASE_MODE: ${{ needs.check.outputs.release_mode }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.check.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Validate package version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Checked-out package version $PACKAGE_VERSION does not match requested release $VERSION." >&2
            exit 1
          fi
          node -e "
            const v = process.argv[1].split('.').map(Number);
            const min = [0, 3, 7];
            const valid = v.length === 3 && v.every(Number.isFinite);
            if (!valid) {
              console.error('Invalid semver version: ' + process.argv[1]);
              process.exit(1);
            }
            const cmp =
              v[0] - min[0] ||
              v[1] - min[1] ||
              v[2] - min[2];
            if (cmp < 0) {
              console.error('Release versions below v0.3.7 are not supported by this workflow.');
              process.exit(1);
            }
          " "$VERSION"

      - name: Validate changelog release date
        run: node scripts/validateReleaseChangelog.js "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit all dependencies
        run: npm run audit:all

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run performance gate
        run: npm run test:perf

      - name: Build extension
        run: npm run package -- --json=webpack-stats.json

      - name: Verify third-party notices
        run: npm run notices && git diff --exit-code -- THIRD_PARTY_NOTICES.txt

      - name: Package VSIX
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$RELEASE_CHANNEL" == "pre-release" ]]; then
            PRERELEASE_ARGS+=(--pre-release)
          fi
          npx --yes @vscode/vsce@3.9.2 package "${PRERELEASE_ARGS[@]}" --no-dependencies --out "sql-crack-${TAG_NAME}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: sql-crack-${{ env.TAG_NAME }}.vsix
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG_NAME: v${{ needs.check.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.check.outputs.release_channel }}
      RELEASE_MODE: ${{ needs.check.outputs.release_mode }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/download-artifact@v4
        with:
          name: release-vsix
      - name: Create GitHub release and tag
        if: ${{ env.RELEASE_MODE == 'full-release' || env.RELEASE_MODE == 'github-release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ needs.check.outputs.checkout_ref }}
          name: ${{ env.TAG_NAME }}
          files: sql-crack-${{ env.TAG_NAME }}.vsix
          generate_release_notes: true
          prerelease: ${{ env.RELEASE_CHANNEL == 'pre-release' }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ (env.RELEASE_MODE == 'full-release' || env.RELEASE_MODE == 'vscode-marketplace') && env.HAS_VSCE_PAT == 'true' }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$RELEASE_CHANNEL" == "pre-release" ]]; then
            PRERELEASE_ARGS+=(--pre-release)
          fi
          npx --yes @vscode/vsce@3.9.2 publish "${PRERELEASE_ARGS[@]}" --packagePath "sql-crack-${TAG_NAME}.vsix"

      - name: Skip VS Code Marketplace publish
        if: ${{ env.RELEASE_MODE == 'full-release' && env.HAS_VSCE_PAT != 'true' }}
        run: echo "VSCE_PAT not configured; skipping VS Code Marketplace publish."

      - name: Require VS Code Marketplace token for targeted retry
        if: ${{ env.RELEASE_MODE == 'vscode-marketplace' && env.HAS_VSCE_PAT != 'true' }}
        run: |
          echo "VSCE_PAT is required for a VS Code Marketplace retry." >&2
          exit 1

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ (env.RELEASE_MODE == 'full-release' || env.RELEASE_MODE == 'open-vsx') && env.HAS_OVSX_PAT == 'true' }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$RELEASE_CHANNEL" == "pre-release" ]]; then
            PRERELEASE_ARGS+=(--pre-release)
          fi
          npx --yes ovsx@1.2.0 publish "sql-crack-${TAG_NAME}.vsix" "${PRERELEASE_ARGS[@]}"

      - name: Skip Open VSX publish
        if: ${{ env.RELEASE_MODE == 'full-release' && env.HAS_OVSX_PAT != 'true' }}
        run: echo "OVSX_PAT not configured; skipping Open VSX publish."

      - name: Require Open VSX token for targeted retry
        if: ${{ env.RELEASE_MODE == 'open-vsx' && env.HAS_OVSX_PAT != 'true' }}
        run: |
          echo "OVSX_PAT is required for an Open VSX retry." >&2
          exit 1
