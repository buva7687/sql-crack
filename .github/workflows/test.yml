name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Kept separate from the test jobs so a newly published advisory is reported
  # on its own instead of failing type checks and tests for unrelated changes.
  # The release build enforces the same audit before anything is published.
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm run audit:all

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        # Coverage is also kept in the test artifact; an external upload outage
        # must not prevent the build and installed-extension checks.
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            coverage/
            junit.xml
          retention-days: 7

  perf:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run parse performance gate
        run: npm run test:perf

  build:
    runs-on: ubuntu-latest
    needs: [test, perf]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run package -- --json=webpack-stats.json

      - name: Verify third-party notices
        run: npm run notices && git diff --exit-code -- THIRD_PARTY_NOTICES.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: dist/
          retention-days: 7

  extension-host:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Package extension for installed smoke tests
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out sql-crack-test.vsix
      - name: Test extension host (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
          VSCODE_TEST_VSIX: sql-crack-test.vsix
      - name: Test extension host (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
          VSCODE_TEST_VSIX: sql-crack-test.vsix
      - name: Test Restricted Mode (Linux)
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        run: xvfb-run -a npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
          VSCODE_TEST_VSIX: sql-crack-test.vsix
          VSCODE_TEST_RESTRICTED: '1'
      - name: Test Restricted Mode (macOS and Windows)
        if: runner.os != 'Linux' && matrix.vscode == 'stable'
        run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
          VSCODE_TEST_VSIX: sql-crack-test.vsix
          VSCODE_TEST_RESTRICTED: '1'
